version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zaminat-postgres
    environment:
      POSTGRES_USER: zaminat
      POSTGRES_PASSWORD: zaminat_password
      POSTGRES_DB: zaminat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaminat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zaminat-backend
    environment:
      DATABASE_URL: postgresql://zaminat:zaminat_password@postgres:5432/zaminat_db?schema=public
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:

